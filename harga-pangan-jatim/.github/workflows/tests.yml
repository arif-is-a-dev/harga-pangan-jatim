# ============================================================
# Menjalankan tes parser setiap kali ada push atau pull request.
#
# Catatan: scraping TIDAK dijalankan di sini karena situs SISKAPERBAPO
# menolak request dari server GitHub (status 403). Scraping harian
# dijalankan dari komputer lokal, lihat scripts/jalankan_harian.bat.
# ============================================================

name: Tes parser

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repo
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Jalankan tes parser
        run: python -m pytest tests -q
