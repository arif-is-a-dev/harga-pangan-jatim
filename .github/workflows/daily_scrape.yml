# ============================================================
# Menjalankan pipeline otomatis setiap hari.
# Jam 06:00 UTC = 13:00 WIB (data pasar biasanya sudah masuk siang hari).
# ============================================================

name: Scrape harga pangan harian

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: # tombol "Run workflow" untuk menjalankan manual

permissions:
  contents: write # dibutuhkan supaya workflow bisa commit file CSV

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repo
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Jalankan tes parser
        run: python -m pytest tests -q

      - name: Jalankan pipeline
        env:
          # Isi di Settings > Secrets and variables > Actions.
          # Kalau tidak diisi, data hanya disimpan sebagai CSV.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/run_pipeline.py

      - name: Commit CSV hari ini
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.csv
          git diff --cached --quiet || git commit -m "data: harga pangan $(date -u +%Y-%m-%d)"
          git push
